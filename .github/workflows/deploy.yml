# A cada push na main: gera o site (confere se o código está ok) e guarda a pasta dist/
# como arquivo para download (aba Actions > execução > Artifacts > "site").
# A publicação no GitHub Pages só acontece quando alguém roda manualmente
# (Actions > Gerar site > Run workflow > marcar "publicar"), e exige o Pages ativado.
name: Gerar site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar no GitHub Pages (precisa do Pages ativado)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
      - if: ${{ inputs.publicar }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ inputs.publicar }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
